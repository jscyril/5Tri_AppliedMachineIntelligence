[project]
name = "ami"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jscyril", email = "jacobsebcyril@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium[toy-text]>=1.3.0",
