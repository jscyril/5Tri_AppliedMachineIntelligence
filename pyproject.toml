    "numpy>=2.5.3",
    "pandas>=3.0.5",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
